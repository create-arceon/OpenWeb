<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenWeb — Résultats</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="results-page">
<header class="results-header">
  <div class="results-top">
    <a class="results-logo" href="/">OpenWeb</a>
    <form class="searchbar" id="search-form" action="/search.html" method="get">
      <input id="search-input" name="q" type="search" autocomplete="off" aria-label="Recherche">
      <button type="submit" aria-label="Rechercher">
<svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
</button>
    </form>
  </div>
  <nav class="navbar" aria-label="Types de résultats">
    <a class="navtab" data-tab="web" href="#">Web</a>
    <a class="navtab" data-tab="images" href="#">Images</a>
    <a class="navtab" data-tab="shopping" href="#">Shopping</a>
    <a class="navtab" data-tab="news" href="#">Actualités</a>
  </nav>
</header>
<main class="results-body">
  <div class="recent-searches" id="recent-searches"></div>
  <div class="toolbar">
    <span id="summary">Recherche en cours…</span>
    <label>Trier :
      <select id="sort" class="sort">
        <option value="relevance">Pertinence</option>
        <option value="date">Plus récent</option>
        <option value="title">Titre</option>
        <option value="domain">Domaine</option>
      </select>
    </label>
  </div>
  <section id="results" aria-live="polite"></section>
  <div id="pagination" class="pagination"></div>
</main>
<footer class="footer">OpenWeb · Résultats Web dédupliqués</footer>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-box"><button class="modal-close" id="modal-close">×</button><img id="modal-image" alt=""></div>
</div>
<script src="/security.js"></script>
<script src="/search.js"></script>
</body>
</html>
