<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenWeb</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="home">
<header class="home-top">
  <a href="/search.html?tab=images">Images</a>
  <a href="/search.html?tab=shopping">Shopping</a>
  <a href="/search.html?tab=news">Actualités</a>
</header>
<main class="home-main">
  <div class="logo">OpenWeb</span></div>
  <div class="home-sub">Recherche Web simple, rapide et sans doublons</div>
  <form class="home-search" action="/search.html" method="get">
    <input name="q" id="home-query" type="search" autocomplete="off" autofocus aria-label="Recherche">
    <button type="submit" aria-label="Rechercher">
<svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
</button>
  </form>
  <div class="home-actions">
    <button type="submit" form="none">Recherche OpenWeb</button>
    <button type="button" id="lucky">J'ai de la chance</button>
  </div>
  <div class="quick">
    <a href="/search.html?tab=web">Web</a>
    <a href="/search.html?tab=images">Images</a>
    <a href="/search.html?tab=shopping">Shopping</a>
    <a href="/search.html?tab=news">Actualités</a>
  </div>
</main>
<footer class="home-footer">© OpenWeb · Interface classique · 2015 style</footer>
<script>
const form=document.querySelector('.home-search');
document.querySelector('.home-actions button[type="submit"]')?.addEventListener('click',()=>form.requestSubmit());
document.getElementById('lucky').addEventListener('click',()=>{
  const q=document.getElementById('home-query').value.trim();
  if(q) location.href='/search.html?q='+encodeURIComponent(q)+'&lucky=1';
  else document.getElementById('home-query').focus();
});
</script>
</body>
</html>
